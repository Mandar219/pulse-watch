version: '3.8'

services:
  # 1. Target Microservice (instrumented Node.js app)
  app:
    build:
      context: ./app
    container_name: pulse-watch-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - AUTO_CHAOS=true # Set to 'false' to manage chaos manually via the HTTP Admin API
    restart: always

  # 2. Dumb Traffic Generator
  traffic-generator:
    build:
      context: ./traffic-generator
    container_name: pulse-watch-traffic-gen
    depends_on:
      - app
    environment:
      - TARGET_URL=http://app:3000/api/v1/resource
      - RPS=15 # User-configurable requests per second
    restart: always

  # 3. Prometheus (Time Series Metrics Database)
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: pulse-watch-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml
    ports:
      - "9090:9090"
    depends_on:
      - app
    restart: always

  # 4. Alertmanager (Alert Routing & Notification management)
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: pulse-watch-alertmanager
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    restart: always

  # 5. Grafana (Dashboard Visualizer)
  grafana:
    image: grafana/grafana:11.0.0
    container_name: pulse-watch-grafana
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/dashboards
    ports:
      - "3001:3000" # Expose on port 3001 to prevent conflicts with our Node.js app (port 3000)
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true # Enable instant passwordless access
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin # Auto-grant SRE Admin rights for testing
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/golden_signals.json # Preload our Golden Signals dashboard
    depends_on:
      - prometheus
    restart: always
