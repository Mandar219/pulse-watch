global:
  resolve_timeout: 10s

route:
  group_by: ['alertname', 'severity']
  group_wait: 2s           # Quick group wait for responsive demo
  group_interval: 5s       # Quick group interval
  repeat_interval: 1m      # Fast repeat for visibility
  receiver: 'target-service-webhook'
  
  routes:
    - match:
        severity: 'page'
      receiver: 'target-service-webhook'
      continue: true
    - match:
        severity: 'warning'
      receiver: 'target-service-webhook'

receivers:
  - name: 'target-service-webhook'
    webhook_configs:
      - url: 'http://app:3000/api/chaos/alert-log'
        send_resolved: true
