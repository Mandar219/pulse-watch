global:
  scrape_interval: 1s         # Core requirement: high-resolution scraping for sub-5s detection
  evaluation_interval: 1s     # Evaluate alerting rules every second

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load rules and evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "rules.yml"

# Scrape configurations
scrape_configs:
  - job_name: 'microservice'
    static_configs:
      - targets: ['app:3000']
